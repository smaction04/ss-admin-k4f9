</head><body>불러오는 중...
<script>
/* 안내 데스크: 이 파일은 바뀌지 않는다. 매번 "지금 시각"을 붙여 진짜 화면(app.html)을 새로 가져오므로,
   GitHub Pages의 약 10분 캐시와 브라우저 캐시에 걸리지 않고 새로고침하면 항상 최신 화면이 뜬다. */
fetch('app.html?t=' + Date.now(), { cache: 'no-store' })
  .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(function (html) { document.open(); document.write(html); document.close(); })
  .catch(function (e) { document.body.textContent = '화면을 불러오지 못했어요. 새로고침해 주세요. (' + e.message + ')'; });
</script>
</body></html>
