<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>슬립세이브 관리센터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* 관제실과 같은 다크 우선 색. 밝은 테마는 기기 설정을 따름 */
:root{--bg:#0A0C15;--surface:#131725;--surface-2:#1B2033;--line:#262C42;--ink:#EDEFF8;--ink-soft:#8C91AC;--ink-faint:#5C6182;
  --accent:#7C9CFF;--accent-ink:#0A0F22;--good:#46D8A0;--good-bg:#123328;--warn:#F0B94E;--warn-bg:#3A2C10;--bad:#F2687A;--bad-bg:#3A1620;
  --font:"Manrope","Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#F4F5FA;--surface:#FFFFFF;--surface-2:#ECEEF6;--line:#DBDEEA;--ink:#161A2C;--ink-soft:#5B6080;--ink-faint:#9296AE;
  --accent:#3E5FDB;--accent-ink:#FFFFFF;--good:#0F8F63;--good-bg:#E1F5EC;--warn:#9A6B0C;--warn-bg:#FBF0D8;--bad:#C23A50;--bad-bg:#FBE4E8}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:ui-monospace,Consolas,monospace;font-size:.92em;background:var(--surface-2);padding:0 4px;border-radius:4px}

.top{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-left));border-bottom:1px solid var(--line);background:var(--surface)}
.brand{font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.brand small{color:var(--ink-soft);font-weight:600;margin-left:6px}
.spacer{flex:1}
.shell{flex:1;min-height:0;display:flex}
.nav{width:190px;flex:none;display:flex;flex-direction:column;gap:2px;padding:12px 10px;border-right:1px solid var(--line);background:var(--surface);overflow-y:auto}
.nav .grp{font-size:11px;letter-spacing:.06em;color:var(--ink-faint);font-weight:700;margin:12px 10px 4px}
.nav .grp:first-child{margin-top:2px}
.nav a{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--ink-soft);text-decoration:none;white-space:nowrap;font-weight:600;font-size:13.5px}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.nav a i{font-style:normal;width:1.3em;text-align:center}
.who{color:var(--ink-faint);font-size:12px;white-space:nowrap}
.btn{border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12.5px;color:var(--ink-soft);background:var(--surface)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}

#view{flex:1;min-width:0;min-height:0;overflow:auto}
.wrap{max-width:1200px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left)) 40px}
.frame{border:0;width:100%;height:100%;display:block}
.center{display:flex;align-items:center;justify-content:center;height:100%;padding:24px;text-align:center;color:var(--ink-soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
h1.pt{font-size:20px;margin:4px 0 2px;letter-spacing:-.01em}
.sub{color:var(--ink-soft);font-size:12.5px;margin:0 0 14px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.tile b{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:600}
.tile span{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.chip{display:inline-block;border-radius:99px;padding:1px 9px;font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--ink-soft);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--bad-bg);color:var(--bad)}
.sec-h{font-size:12px;letter-spacing:.05em;color:var(--ink-soft);font-weight:700;margin:20px 0 8px}
.muted{color:var(--ink-soft)}
.search{width:100%;max-width:420px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 10px;font:inherit}
.when{margin:0 0 10px;padding:7px 12px;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:6px;font-size:12.5px;color:var(--ink-soft)}
.ops{display:flex;flex-direction:column;height:100%}
.ops-when{margin:8px max(16px,env(safe-area-inset-left)) 0;flex:none}
.ops .frame{flex:1;min-height:0;height:auto}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin:0 0 12px}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;padding:7px 12px;font-size:13px;font-weight:700;color:var(--ink-soft);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabbed h1.pt{font-size:16px}
@media (max-width:760px){
  .shell{flex-direction:column}
  .nav{width:auto;flex-direction:row;border-right:0;border-bottom:1px solid var(--line);padding:6px 10px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav .grp{display:none}
}
@media (max-width:640px){.who{display:none}.brand small{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">🌘 SleepSave<small>관리센터</small></div>
  <span class="spacer"></span>
  <span class="who" id="who"></span>
  <button class="btn" id="signOut" hidden>로그아웃</button>
</header>
<div class="shell">
  <nav class="nav" id="nav" aria-label="메뉴"></nav>
  <main id="view"><div class="center">불러오는 중...</div></main>
</div>

<script>
/* 관리센터 뼈대. 메뉴마다 따로 파일(p_*.js)이고, 눌렀을 때만 불러온다.
   내용은 서버(admin_hub_docs)에서 관리자만 읽는다 — 이 저장소에는 내용이 없다. */
const SUPABASE_URL = "https://mdcjpgbhpwjheaprogxr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_jHw2UufXRWscdg4ZitfMGw_DHEagC8n"; // 공개용 anon key, 서버 함수가 관리자+2단계를 다시 확인한다
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const V = Date.now();
/* 메뉴 8개 = 관리자가 묻는 질문 순서. [주소, 이름, 아이콘, 묶음 머리글]
   여러 문서를 한 메뉴에 묶은 곳은 TABS 로 탭을 단다. 옛 주소(#/checklist 등)도 그 탭으로 그대로 열린다. */
const MENU = [
  ['home','한눈에 보기','🏠','오늘'],
  ['ops','관제실','📊','운영'],['users','사용자','👥'],['suspects','의심 유저','🚨'],['pnl','손익','💹'],['coupon','쿠폰 대상자','🎁'],['auction','경매','🔨'],
  ['vendor','경매 업체','🏪'],['notice','공지사항','📢'],['celebrate','축하창','🎉'],['feedback','받은 의견','🐰'],['tester','테스터 신청','🧪'],['roadmap','업데이트 예정','🗺️'],['changelog','버전별 변경 기록','📝'],
  ['launch','출시 준비','🚀','할 일'],['guide_feedback','테스트·의견','💬'],['vendors','업체·돈','🤝'],
  ['records','진행 기록','📋','기록'],
  ['library','참고 문서','📚','자료'],['links','바로가기','🔗']
];
const TABS = {
  launch:[['preflight','출시 점검표'],['checklist','앱 품질 점검판']],
  records:[['status','현재 상태 한 장'],['todo','보류·할 일 장부']],
  library:[['guide_intro','서비스 소개서'],['guide_plan','단독 실행 기획서'],['guide_screen','화면 설계'],['guide_gifti','기프티쇼 API'],['guide_design','디자인 개편 제안서'],['design','디자인 시안']]
};
/* 화면 맨 위 한 줄: 언제 보는 곳인지 */
const WHEN = {
  ops:'매일 한 번 — 오늘 가입·지급·잔액 숫자와 경보를 보는 곳',
  pnl:'월말·결산 때, 또는 돈 얘기가 나올 때 — 얼마 벌고 얼마 나갔는지(30초마다 자동 갱신)',
  notice:'앱 첫 화면 전광판과 설정의 공지 게시판에 보일 공지를 쓰고 고치고 지울 때',
  celebrate:'잭팟·7일 출석 보상을 받았을 때 앱에 뜨는 축하창의 글·색·크기·버튼을 고칠 때',
  coupon:'테스트 14일 개근자 확인할 때 — 성함·전화번호 보고 스벅쿠폰 보낸 뒤 "발송 완료"를 눌러요',
  auction:'업체가 올린 경매 상품을 허락·거절하고, 당첨 뒤 배송 표시·문제 신고·정산 기록까지 챙길 때',
  vendor:'경매 업체가 가입 신청을 하면 사업자등록증을 보고 허락·거절할 때',
  roadmap:'앱에 새로 넣을 기능을 정할 때 — 후보와 정해진 내용을 적어 두는 곳',
  changelog:'새 버전을 올릴 때·테스터에게 바뀐 점을 알릴 때 — 버전마다 뭐가 달라졌는지',
  tester:'테스터 신청자가 어디까지 왔는지 볼 때 — 신청 → 명단 등록 → 앱 가입 → 14일 달성 현황과 바로가기',
  feedback:'테스터가 앱 토끼 버튼으로 보낸 글을 읽을 때 — 최신순(30초마다 자동 갱신)',
  users:'앱에 가입한 사람들을 한 줄씩 봐요',
  suspects:'가능한 시간보다 부풀려 보고한 사람 등 수상한 사용자를 모아 봐요',
  home:'열자마자 보는 곳 — 테스터·의견·쿠폰·숫자를 한 번에 보고, 내가 할 일과 출시를 막는 것을 확인해요',
  launch:'출시 버튼 누르기 전에 — 빠진 게 없는지 하나씩 확인하는 곳',
  guide_feedback:'테스터 의견이 들어왔을 때 — 받은 의견과 고친 내용을 적어 두는 곳(프로덕션 신청서 재료)',
  vendors:'업체에 연락하거나 돈이 오갈 때 — 광고·기프티콘 업체별 상태',
  records:'지난 일을 찾아볼 때 — 원본 기록 그대로(길어요). 할 일만 보려면 오늘 할 일로',
  library:'설명·기획을 다시 읽을 때 — 원본 문서·시안 그대로',
  links:'바깥 사이트(플레이 콘솔·애드몹·서버 등)로 바로 갈 때'
};
const FILES = {pnl:'p_pnl.js',coupon:'p_coupon.js',auction:'p_auction.js',vendor:'p_vendor.js',notice:'p_notice.js',celebrate:'p_celebrate.js',feedback:'p_feedback.js',tester:'p_tester.js',roadmap:'p_roadmap.js',changelog:'p_changelog.js',home:'p_home.js',checklist:'p_checklist.js',status:'p_docs.js',preflight:'p_docs.js',vendors:'p_vendors.js',todo:'p_docs.js',guide_intro:'p_docs.js',guide_plan:'p_docs.js',guide_screen:'p_docs.js',guide_gifti:'p_docs.js',guide_design:'p_docs.js',guide_feedback:'p_docs.js',design:'p_html.js',links:'p_links.js'};
window.PAGES = {};
const view = document.getElementById('view');
const docCache = {};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
/* 아주 작은 글자 꾸밈: **굵게**, `코드`, [글](https://링크), 맨 주소. 원문은 먼저 이스케이프한다 */
function md(s){
  return esc(s)
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/`([^`]+)`/g,'<code>$1</code>');
}
async function getDoc(key,force){
  if(docCache[key]&&!force) return docCache[key];
  const {data,error}=await sb.rpc('admin_hub_get',{p_key:key});
  if(error) throw new Error(error.message);
  if(!data||!data.length) throw new Error('문서 "'+key+'"가 서버에 아직 없어요 (sync_hub.py 실행 필요)');
  return (docCache[key]=data[0]);
}
async function listDocs(){const {data,error}=await sb.rpc('admin_hub_list');if(error)throw new Error(error.message);return data||[]}
function ago(iso){const m=Math.round((Date.now()-new Date(iso))/60000);if(m<1)return '방금';if(m<60)return m+'분 전';const h=Math.round(m/60);if(h<48)return h+'시간 전';return Math.round(h/24)+'일 전'}
const ctx={sb,esc,md,getDoc,listDocs,ago,go:(p)=>{location.hash='#/'+p}};

const loading={};
function loadScript(file){
  if(loading[file]) return loading[file];
  return (loading[file]=new Promise((res,rej)=>{
    const s=document.createElement('script');s.src=file+'?v='+V;s.dataset.p=file;s.onload=res;
    s.onerror=()=>{s.remove();delete loading[file];rej(new Error(file+' 불러오기 실패'))};
    document.head.appendChild(s);
  }));
}
function drawNav(cur){
  const nav=document.getElementById('nav');
  nav.innerHTML=MENU.map(m=>(m[3]?'<div class="grp">'+m[3]+'</div>':'')+'<a href="#/'+m[0]+'"'+(m[0]===cur?' aria-current="page"':'')+'><i>'+m[2]+'</i>'+m[1]+'</a>').join('');
}
let token=0;
/* 주소 → (메뉴, 실제 화면). 묶음 메뉴는 첫 탭, 옛 주소는 자기가 속한 메뉴로 */
function resolve(cur){
  if(TABS[cur]) return {menu:cur,page:TABS[cur][0][0]};
  for(const k in TABS) if(TABS[k].some(t=>t[0]===cur)) return {menu:k,page:cur};
  if(MENU.some(m=>m[0]===cur)) return {menu:cur,page:cur};
  return {menu:'home',page:'home'};
}
async function route(){
  const cur=(location.hash.replace(/^#\/?/,'')||'home').split('?')[0];
  const {menu,page}=resolve(cur);
  drawNav(menu);
  const my=++token;
  if(page==='ops'||page==='users'||page==='suspects'){
    view.innerHTML='<div class="ops"><p class="when ops-when">'+esc(WHEN[page])+'</p><iframe class="frame" title="관제실" src="app.html?embed=1'+(page==='ops'?'':'&tab='+page)+'&t='+V+'"></iframe></div>';
    return;
  }
  view.innerHTML='<div class="center">불러오는 중...</div>';
  try{
    await loadScript(FILES[page]);
    if(my!==token) return;
    const wrap=document.createElement('div');wrap.className='wrap'+(TABS[menu]?' tabbed':'');
    const tabs=TABS[menu]?'<div class="tabs" role="tablist">'+TABS[menu].map(t=>'<a role="tab" href="#/'+t[0]+'"'+(t[0]===page?' aria-selected="true"':'')+'>'+esc(t[1])+'</a>').join('')+'</div>':'';
    wrap.innerHTML='<p class="when">'+esc(WHEN[menu]||'')+'</p>'+tabs;
    const root=document.createElement('div');wrap.appendChild(root);
    view.innerHTML='';view.appendChild(wrap);
    const sel=wrap.querySelector('.tabs [aria-selected]');if(sel)sel.scrollIntoView({block:'nearest',inline:'center'});
    await window.PAGES[page].render(root,ctx,page);
  }catch(e){
    if(my!==token) return;
    view.innerHTML='<div class="center"><div class="card" style="max-width:520px"><b>화면을 못 불러왔어요</b><p class="muted">'+esc(e.message)+'</p><button class="btn" onclick="route()">다시 시도</button></div></div>';
  }
}
async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){return gate('로그인이 필요해요. 로그인은 아래 버튼의 화면에서 합니다(비밀번호 → 폰 인증앱 6자리). 끝나면 이 관리센터로 자동으로 돌아와요.')}
  const {data:isAdmin}=await sb.rpc('is_admin');
  if(isAdmin!==true){return gate('관리자 계정이 아니에요. 관리자 이메일로 다시 로그인해 주세요.')}
  const {data:aal}=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  if(!aal||aal.currentLevel!=='aal2'){return gate('폰 인증앱(2단계) 확인이 아직이에요. 관제실 화면에서 6자리를 입력해 주세요.')}
  document.getElementById('who').textContent=session.user.email;
  const so=document.getElementById('signOut');so.hidden=false;so.onclick=async()=>{await sb.auth.signOut();location.reload()};
  window.addEventListener('hashchange',route);route();
}
function gate(msg){
  drawNav('');
  view.innerHTML='<div class="center"><div class="card" style="max-width:460px"><b>🔒 슬립세이브 관리센터</b><p class="muted">'+esc(msg)+'</p><a class="btn primary" style="text-decoration:none;display:inline-block" href="app.html">로그인하러 가기</a></div></div>';
}
start();
</script>
</body></html>
